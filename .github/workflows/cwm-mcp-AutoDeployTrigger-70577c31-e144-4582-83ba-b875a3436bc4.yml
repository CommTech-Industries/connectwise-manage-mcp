name: Trigger auto deployment for cwm-mcp

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ feature/simple-ticket-status ]
    paths:
    - '**'
    - '.github/workflows/cwm-mcp-AutoDeployTrigger-70577c31-e144-4582-83ba-b875a3436bc4.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CWMMCP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CWMMCP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CWMMCP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: commtechcwmcpacr-cpgmdma0f8ang4am.azurecr.io
          registryUsername: ${{ secrets.CWMMCP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CWMMCP_REGISTRY_PASSWORD }}
          containerAppName: cwm-mcp
          resourceGroup: rg-ct-connectwise-mcp
          imageToBuild: commtechcwmcpacr-cpgmdma0f8ang4am.azurecr.io/cwm-mcp:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


